<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>週間業務予定表</title><style>body{font-family:system-ui,sans-serif;background:#eef3f8;color:#18334a;margin:0}header{background:#184768;color:white;padding:16px}main{max-width:1300px;margin:auto;padding:14px}.panel{background:white;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{display:grid;gap:4px}input,select,button{font:inherit;padding:7px;border:1px solid #ccd6df;border-radius:5px}button{background:#17648b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d8e0e7;padding:7px}th{background:#e6eff6}.day{text-align:center;min-width:36px}.planned{background:#b7d9ee}.completed{background:#b9e6c6}.hidden{display:none}.error{color:#b42318}#login{max-width:420px;margin:50px auto}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@page{size:A4 landscape;margin:8mm}@media print{body{background:white}header{background:white;color:black}.panel{margin:0;padding:5px}.no-print{display:none!important}main{max-width:none;padding:0}.scroll{overflow:visible}table{font-size:9px}th,td{padding:3px}}</style></head><body><header><b>週間業務予定表</b>　物件別ガントチャート</header><main><section id="login" class="panel"><h2>ログイン</h2><label>メールアドレス<input id="email" type="email"></label><br><label>パスワード<input id="password" type="password"></label><br><button id="signIn">ログイン</button><p id="loginError" class="error"></p></section><section id="app" class="hidden"><div class="panel toolbar no-print"><button id="prev">前週</button><label>週の月曜日<input type="date" id="week"></label><button id="next">翌週</button><button id="refresh">更新</button><button id="export">CSV出力</button><button onclick="window.print()">A4横印刷</button><button id="signOut">ログアウト</button></div><div class="panel"><b id="summary"></b>　<small id="status"></small></div><div class="panel no-print"><h3 id="formTitle">作業登録</h3><form id="form"><div class="grid"><label>物件名<input name="project_name" maxlength="120" required></label><label>作業内容<input name="description" maxlength="300" required></label><label>開始日<input name="start_date" type="date" required></label><label>終了日<input name="end_date" type="date" required></label><label>予定開始<input name="planned_start" type="time" required></label><label>予定終了<input name="planned_end" type="time" required></label><label>実行開始<input name="actual_start" type="time"></label><label>実行終了<input name="actual_end" type="time"></label><label>昼休憩控除<select name="subtract_lunch"><option value="true">する</option><option value="false">しない</option></select></label></div><p><button type="submit">保存</button> <button type="button" id="cancel">編集取消</button></p></form></div><div class="panel"><h3>週間ToDo・ガントチャート</h3><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p>青：予定　緑：完了。複数日にまたがる作業も、入力した時間は1作業分として計算します。</p></div></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='REPLACE_SUPABASE_URL',KEY='REPLACE_PUBLISHABLE_KEY';const $=id=>document.getElementById(id);let client=null,user=null,tasks=[],editId=null;
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const date=s=>new Date(s+'T12:00:00');const add=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return ds(d)};const mon=d=>{let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return ds(x)};$('week').value=mon(new Date());
const mins=t=>t?Number(t.slice(0,2))*60+Number(t.slice(3,5)):null;function duration(a,b,lunch){let x=mins(a),y=mins(b);if(x===null||y===null||y<x)return null;return Math.max(0,y-x-(lunch?Math.max(0,Math.min(y,780)-Math.max(x,720)):0))}const fmt=m=>m===null?'—':(m/60).toFixed(2)+'h';const cell=(t,cls='')=>{let x=document.createElement('td');x.textContent=t??'';x.className=cls;return x};const button=(txt,fn)=>{let b=document.createElement('button');b.textContent=txt;b.className='no-print';b.onclick=fn;return b};function fail(e){alert(e.message||String(e))}
function reset(){editId=null;$('form').reset();$('formTitle').textContent='作業登録';$('form').elements.start_date.value=$('week').value;$('form').elements.end_date.value=$('week').value}
async function load(){if(!user)return;$('status').textContent='同期中…';let {data,error}=await client.from('weekly_tasks').select('*').eq('user_id',user.id).order('start_date');if(error){$('status').textContent='同期失敗';fail(error);return}tasks=data;$('status').textContent='同期済み';render()}
function render(){let week=$('week').value,days=Array.from({length:7},(_,i)=>add(week,i));let shown=tasks.filter(t=>t.start_date<=days[6]&&t.end_date>=days[0]);let head=document.createElement('tr');['完了','物件名','作業内容','予定時間','実行時間','状態',...days.map((d,i)=>'月火水木金土日'[i]+' '+d.slice(5)),'操作'].forEach(x=>{let th=document.createElement('th');th.textContent=x;head.append(th)});$('thead').replaceChildren(head);$('tbody').replaceChildren();let plan=0,actual=0,done=0;
for(let t of shown){let tr=document.createElement('tr'),td=cell(''),cb=document.createElement('input');cb.type='checkbox';cb.checked=t.completed;cb.onchange=async()=>{let {error}=await client.from('weekly_tasks').update({completed:cb.checked}).eq('id',t.id).eq('user_id',user.id);if(error){cb.checked=!cb.checked;fail(error)}else load()};td.append(cb);tr.append(td,cell(t.project_name),cell(t.description));let p=duration(t.planned_start,t.planned_end,t.subtract_lunch),a=duration(t.actual_start,t.actual_end,t.subtract_lunch);plan+=p||0;actual+=a||0;done+=Number(t.completed);tr.append(cell(fmt(p)),cell(fmt(a)),cell(t.completed?'完了':a===null?'未着手':'進行中'));for(let d of days){let active=d>=t.start_date&&d<=t.end_date;tr.append(cell(active?(t.completed?'✓':'■'):'','day '+(active?(t.completed?'completed':'planned'):'')))}let actions=cell('');actions.append(button('編集',()=>{editId=t.id;for(let [k,v] of Object.entries(t)){let f=$('form').elements.namedItem(k);if(f)f.value=typeof v==='boolean'?String(v):v??''}$('formTitle').textContent='作業編集';window.scrollTo(0,0)}),' ',button('削除',async()=>{if(!confirm('削除しますか？'))return;let {error}=await client.from('weekly_tasks').delete().eq('id',t.id).eq('user_id',user.id);if(error)fail(error);else load()}));tr.append(actions);$('tbody').append(tr)}$('summary').textContent=`予定 ${fmt(plan)} ／ 実行 ${fmt(actual)} ／ 完了 ${done} / ${shown.length}件`}
$('form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.subtract_lunch=o.subtract_lunch==='true';if(o.end_date<o.start_date)return alert('終了日を確認してください');for(let [a,b] of [['planned_start','planned_end'],['actual_start','actual_end']]){if(Boolean(o[a])!==Boolean(o[b])||(o[a]&&mins(o[b])<mins(o[a])))return alert('時刻の開始・終了を確認してください')}for(let k of ['actual_start','actual_end'])if(!o[k])o[k]=null;let q=editId?client.from('weekly_tasks').update(o).eq('id',editId).eq('user_id',user.id):client.from('weekly_tasks').insert({...o,user_id:user.id});let {error}=await q;if(error)return fail(error);reset();load()};$('cancel').onclick=reset;$('prev').onclick=()=>{$('week').value=add($('week').value,-7);render()};$('next').onclick=()=>{$('week').value=add($('week').value,7);render()};$('week').onchange=render;$('refresh').onclick=load;
$('export').onclick=()=>{let keys=['project_name','description','start_date','end_date','planned_start','planned_end','actual_start','actual_end','subtract_lunch','completed'];let q=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv='\ufeff'+[keys.join(','),...tasks.map(t=>keys.map(k=>q(t[k])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='weekly_tasks.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(URL.startsWith('REPLACE_'))$('loginError').textContent='初期設定が必要です。Supabase URLと公開キーを設定してください。';else{client=createClient(URL,KEY);$('signIn').onclick=async()=>{let {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginError').textContent=error.message};$('signOut').onclick=()=>client.auth.signOut();client.auth.onAuthStateChange((event,session)=>{let old=user?.id;user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user&&old!==user.id){reset();setTimeout(load,0)}if(!user)tasks=[]})}
</script></body></html>
