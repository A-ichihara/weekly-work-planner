<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>週間業務予定表</title><style>body{font-family:system-ui,sans-serif;background:#eef3f8;color:#18334a;margin:0}header{background:#184768;color:white;padding:16px}main{max-width:1300px;margin:auto;padding:14px}.panel{background:white;border-radius:10px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{display:grid;gap:4px}input,select,button{font:inherit;padding:7px;border:1px solid #ccd6df;border-radius:5px}button{background:#17648b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d8e0e7;padding:7px}th{background:#e6eff6}.day{text-align:center;min-width:36px}.planned{background:#b7d9ee}.completed{background:#b9e6c6}.hidden{display:none}.error{color:#b42318}.daily-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.daily-row{border:1px solid #d8e0e7;border-radius:8px;padding:10px}.daily-row b{display:block;margin-bottom:6px}.daily-row label{margin-top:6px}@media(max-width:700px){.daily-grid{grid-template-columns:1fr}}#login{max-width:420px;margin:50px auto}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scroll table{min-width:980px;table-layout:auto}.scroll th,.scroll td{white-space:nowrap;padding:6px}.scroll td:nth-child(3),.scroll th:nth-child(3){min-width:230px;max-width:300px;white-space:normal;overflow-wrap:anywhere}.scroll td:nth-child(2),.scroll th:nth-child(2){min-width:120px}.scroll td:last-child,.scroll th:last-child{min-width:105px}.scroll .day{min-width:36px}}@page{size:A4 landscape;margin:8mm}@media print{body{background:white}header{background:white;color:black}.panel{margin:0;padding:5px}.no-print{display:none!important}main{max-width:none;padding:0}.scroll{overflow:visible}table{font-size:9px}th,td{padding:3px}}</style></head><body><header><b>週間業務予定表</b>　物件別ガントチャート</header><main><section id="login" class="panel"><h2>ログイン</h2><label>メールアドレス<input id="email" type="email"></label><br><label>パスワード<input id="password" type="password"></label><br><button id="signIn">ログイン</button><p id="loginError" class="error"></p></section><section id="app" class="hidden"><div class="panel toolbar no-print"><button id="prev">前週</button><label>週の月曜日<input type="date" id="week"></label><button id="next">翌週</button><button id="refresh">更新</button><button id="export">CSV出力</button><button onclick="window.print()">A4横印刷</button><button id="signOut">ログアウト</button></div><div class="panel"><b id="summary"></b>　<small id="status"></small></div><div class="panel no-print"><h3 id="formTitle">作業登録</h3><form id="form"><div class="grid"><label>物件名<input name="project_name" maxlength="120" required></label><label>作業内容<input name="description" maxlength="300" required></label><label>開始日<input name="start_date" type="date" required></label><label>終了日<input name="end_date" type="date" required></label><label>予定開始<input name="planned_start" type="time" step="300" required></label><label>予定終了<input name="planned_end" type="time" step="300" required></label><label>実行開始<input name="actual_start" type="time" step="300"></label><label>実行終了<input name="actual_end" type="time" step="300"></label><label>昼休憩控除<select name="subtract_lunch"><option value="true">する</option><option value="false">しない</option></select></label></div><div class="grid"><label>予定時間の設定<select name="planned_time_mode"><option value="same">全日同じ時間</option><option value="daily">日ごとに変更</option></select></label><label>実行時間の設定<select name="actual_time_mode"><option value="same">全日同じ時間</option><option value="daily">日ごとに変更</option></select></label></div><div id="plannedDaily" class="daily-grid hidden"></div><div id="actualDaily" class="daily-grid hidden"></div><p><button type="submit">保存</button> <button type="button" id="cancel">編集取消</button></p></form></div><div class="panel"><h3>週間ToDo・ガントチャート</h3><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p>青：予定　緑：完了。複数日にまたがる作業も、入力した時間は1作業分として計算します。</p></div></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://ivhgdchqdbgudbyfbfhs.supabase.co',KEY='sb_publishable_Aza_8M7IrsiCvUeiAwx50w_7m5mTkor';const $=id=>document.getElementById(id);let client=null,user=null,tasks=[],editId=null;
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const date=s=>new Date(s+'T12:00:00');const add=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return ds(d)};const mon=d=>{let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return ds(x)};$('week').value=mon(new Date());
const mins=t=>t?Number(t.slice(0,2))*60+Number(t.slice(3,5)):null;function duration(a,b,lunch){let x=mins(a),y=mins(b);if(x===null||y===null||y<x)return null;return Math.max(0,y-x-(lunch?Math.max(0,Math.min(y,780)-Math.max(x,720)):0))}function taskDuration(t,prefix){let daily=t[prefix+'_daily_times']||{};if(Object.keys(daily).length)return Object.values(daily).reduce((sum,v)=>sum+(duration(v.start,v.end,t.subtract_lunch)||0),0);return duration(t[prefix+'_start'],t[prefix+'_end'],t.subtract_lunch)}const fmt=m=>m===null?'—':(m/60).toFixed(2)+'h';const cell=(t,cls='')=>{let x=document.createElement('td');x.textContent=t??'';x.className=cls;return x};const button=(txt,fn)=>{let b=document.createElement('button');b.textContent=txt;b.className='no-print';b.onclick=fn;return b};function fail(e){alert(e.message||String(e))}
function reset(){editId=null;$('form').reset();$('formTitle').textContent='作業登録';$('form').elements.start_date.value=$('week').value;$('form').elements.end_date.value=$('week').value;renderDailyInputs()}
function renderDailyInputs(){let f=$('form').elements,s=f.start_date.value,e=f.end_date.value;if(!s||!e||e<s)return;let n=Math.min(31,Math.round((date(e)-date(s))/86400000)+1);for(let [mode,container,prefix,label] of [['planned_time_mode','plannedDaily','planned','予定'],['actual_time_mode','actualDaily','actual','実行']]){let box=$(container),active=f[mode].value==='daily';f[prefix+'_start'].required=!active&&prefix==='planned';f[prefix+'_end'].required=!active&&prefix==='planned';box.classList.toggle('hidden',!active);box.replaceChildren();if(!active)continue;for(let i=0;i<n;i++){let d=add(s,i),row=document.createElement('div');row.className='daily-row';let title=document.createElement('b');title.textContent=d+'（'+label+'）';row.append(title);for(let [part,caption] of [['start','開始'],['end','終了']]){let lab=document.createElement('label');lab.textContent=caption;let inp=document.createElement('input');inp.type='time';inp.step='300';inp.dataset.daily=prefix;inp.dataset.date=d;inp.dataset.part=part;inp.required=false;let existing=JSON.parse(f[prefix+'_daily_times'].value||'{}');inp.value=existing[d]?(existing[d][part]||''):(part==='start'?f[prefix+'_start'].value:f[prefix+'_end'].value)||'';lab.append(inp);row.append(lab)}box.append(row)}}}for(let p of ['planned','actual']){let h=document.createElement('input');h.type='hidden';h.name=p+'_daily_times';$('form').append(h)}for(let id of ['start_date','end_date'])$('form').elements[id].addEventListener('change',renderDailyInputs);for(let id of ['planned_time_mode','actual_time_mode'])$('form').elements[id].addEventListener('change',renderDailyInputs);
async function load(){if(!user)return;$('status').textContent='同期中…';let {data,error}=await client.from('weekly_planner_tasks').select('*').eq('user_id',user.id).order('start_date');if(error){$('status').textContent='同期失敗';fail(error);return}tasks=data;if(data.length===0){$('status').textContent=`同期済み：${user.email||'メール不明'} ／ 0件。PCと同じアカウントか確認してください。`}else{$('status').textContent=`同期済み：${user.email||'メール不明'} ／ ${data.length}件`;}render()}
function render(){let week=$('week').value,days=Array.from({length:7},(_,i)=>add(week,i));let shown=tasks.filter(t=>t.start_date<=days[6]&&t.end_date>=days[0]).sort((a,b)=>{let day=a.start_date.localeCompare(b.start_date);if(day)return day;let at=(a.planned_daily_times||{})[a.start_date]?.start||a.planned_start||'99:99';let bt=(b.planned_daily_times||{})[b.start_date]?.start||b.planned_start||'99:99';return at.localeCompare(bt)||String(a.project_name||'').localeCompare(String(b.project_name||''),'ja')});let head=document.createElement('tr');['完了','物件名','作業内容','予定時間','実行時間','状態',...days.map((d,i)=>'月火水木金土日'[i]+' '+d.slice(5)),'操作'].forEach(x=>{let th=document.createElement('th');th.textContent=x;head.append(th)});$('thead').replaceChildren(head);$('tbody').replaceChildren();let plan=0,actual=0,done=0;
for(let t of shown){let tr=document.createElement('tr'),td=cell(''),cb=document.createElement('input');cb.type='checkbox';cb.checked=t.completed;cb.onchange=async()=>{let {error}=await client.from('weekly_planner_tasks').update({completed:cb.checked}).eq('id',t.id).eq('user_id',user.id);if(error){cb.checked=!cb.checked;fail(error)}else load()};td.append(cb);tr.append(td,cell(t.project_name),cell(t.description));let p=taskDuration(t,'planned'),a=taskDuration(t,'actual');plan+=p||0;actual+=a||0;done+=Number(t.completed);tr.append(cell(fmt(p)),cell(fmt(a)),cell(t.completed?'完了':a===null?'未着手':'進行中'));for(let d of days){let active=d>=t.start_date&&d<=t.end_date;tr.append(cell(active?(t.completed?'✓':'■'):'','day '+(active?(t.completed?'completed':'planned'):'')))}let actions=cell('');actions.append(button('編集',()=>{editId=t.id;for(let [k,v] of Object.entries(t)){let f=$('form').elements.namedItem(k);if(f)f.value=typeof v==='boolean'?String(v):v??''}for(let p of ['planned','actual']){$('form').elements[p+'_time_mode'].value=Object.keys(t[p+'_daily_times']||{}).length?'daily':'same';$('form').elements[p+'_daily_times'].value=JSON.stringify(t[p+'_daily_times']||{})}renderDailyInputs();$('formTitle').textContent='作業編集';window.scrollTo(0,0)}),' ',button('削除',async()=>{if(!confirm('削除しますか？'))return;let {error}=await client.from('weekly_planner_tasks').delete().eq('id',t.id).eq('user_id',user.id);if(error)fail(error);else load()}));tr.append(actions);$('tbody').append(tr)}$('summary').textContent=`予定 ${fmt(plan)} ／ 実行 ${fmt(actual)} ／ 完了 ${done} / ${shown.length}件`}
$('form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.subtract_lunch=o.subtract_lunch==='true';for(let p of ['planned','actual']){let mode=o[p+'_time_mode'],daily={};if(mode==='daily'){for(let inp of document.querySelectorAll('input[data-daily="'+p+'"]')){daily[inp.dataset.date]??={};daily[inp.dataset.date][inp.dataset.part]=inp.value}for(let [day,v] of Object.entries(daily)){if(Boolean(v.start)!==Boolean(v.end))return alert(day+'の'+(p==='planned'?'予定':'実行')+'時間は、開始・終了を両方入力するか、両方空欄にしてください');if(v.start&&mins(v.end)<mins(v.start))return alert(day+'の'+(p==='planned'?'予定':'実行')+'時間を確認してください')}o[p+'_daily_times']=daily;let first=Object.values(daily).find(v=>v.start&&v.end);o[p+'_start']=first?.start||null;o[p+'_end']=first?.end||null}else{o[p+'_daily_times']={}}delete o[p+'_time_mode']}if(o.end_date<o.start_date)return alert('終了日を確認してください');for(let [a,b,p] of [['planned_start','planned_end','planned'],['actual_start','actual_end','actual']]){if(!Object.keys(o[p+'_daily_times']||{}).length&&(Boolean(o[a])!==Boolean(o[b])||(o[a]&&mins(o[b])<mins(o[a]))))return alert('時刻の開始・終了を確認してください')}for(let k of ['actual_start','actual_end'])if(!o[k])o[k]=null;let q=editId?client.from('weekly_planner_tasks').update(o).eq('id',editId).eq('user_id',user.id):client.from('weekly_planner_tasks').insert({...o,user_id:user.id});let {error}=await q;if(error)return fail(error);reset();load()};$('cancel').onclick=reset;$('prev').onclick=()=>{$('week').value=add($('week').value,-7);render()};$('next').onclick=()=>{$('week').value=add($('week').value,7);render()};$('week').onchange=render;$('refresh').onclick=load;
$('export').onclick=()=>{let keys=['project_name','description','start_date','end_date','planned_start','planned_end','actual_start','actual_end','subtract_lunch','completed'];let q=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv='\ufeff'+[keys.join(','),...tasks.map(t=>keys.map(k=>q(t[k])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='weekly_planner_tasks.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(URL.startsWith('REPLACE_'))$('loginError').textContent='初期設定が必要です。Supabase URLと公開キーを設定してください。';else{client=createClient(URL,KEY);$('signIn').onclick=async()=>{let {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginError').textContent=error.message};$('signOut').onclick=()=>client.auth.signOut();client.auth.onAuthStateChange((event,session)=>{let old=user?.id;user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user&&old!==user.id){reset();setTimeout(load,0)}if(!user)tasks=[]})}
</script></body></html>
