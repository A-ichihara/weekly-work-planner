// Web Push is prepared but intentionally unavailable until server-side VAPID and delivery are configured.
$('pushSetup').onclick=async()=>{
 const status=$('pushStatus');
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
   status.textContent='この環境ではWebプッシュ通知に対応していません。iPhoneはSafariからホーム画面に追加したアプリでお試しください。';return;
 }
 try{
   const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
   await navigator.serviceWorker.ready;
   const config=await fetch('https://ivhgdchqdbgudbyfbfhs.supabase.co/functions/v1/weekly-planner-push');
   if(!config.ok){status.textContent='通知サーバーの設定はまだ完了していません。設定完了後にもう一度お試しください。';return;}
   const {publicKey}=await config.json();
   if(!publicKey)throw Error('通知公開鍵がありません');
   const permission=await Notification.requestPermission();
   if(permission!=='granted'){status.textContent='通知が許可されていません。端末の通知設定を確認してください。';return;}
   const bytes=(base64)=>Uint8Array.from(atob(base64.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-base64.length%4)%4)),c=>c.charCodeAt(0));
   let sub=await reg.pushManager.getSubscription();
   if(sub&&sub.options?.applicationServerKey&&Array.from(new Uint8Array(sub.options.applicationServerKey)).join(',')!==Array.from(bytes(publicKey)).join(',')){await sub.unsubscribe();sub=null}
   if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes(publicKey)});
   const j=sub.toJSON();
   const {error}=await client.from('weekly_planner_push_subscriptions').upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_secret:j.keys.auth},{onConflict:'endpoint'});
   if(error)throw error;
   status.textContent='この端末の通知登録が完了しました。自動送信の稼働確認は別途必要です。';
 }catch(e){status.textContent='通知の準備に失敗しました：'+(e.message||String(e))}
};

// ===== Task Management App (mgmt-app) との双方向同期 (ボタン押下時のみ実行) =====
// 両アプリは同じ Supabase プロジェクト・同じ Auth ユーザーを使うため、
// Task 側の tasks テーブルを直接読み書きする。紐づけは「同じ id」。
// この端末で前回同期したときのペア id を localStorage に持ち、
// 「前回はペアだったのに片方だけにある」ものを削除として扱う。
// 同期結果 (件数と失敗理由) はツールバーのステータスに表示する。
const MGMT_SYNC_KEY='mgmtSyncKnownIds:v1';
function mgmtSyncableFactory(M){
  const childParents=new Set(M.filter(t=>t.parent_task_id).map(t=>t.parent_task_id));
  const pStart=t=>t.planned_start_date||t.start_date;
  return {childParents,pStart,
    pEnd:t=>t.planned_end_date||t.end_date||pStart(t),
    syncable:t=>!!t&&(!t.category||t.category==='work')&&!t.is_milestone&&!childParents.has(t.id)&&!!pStart(t)};
}
function mgmtPeriodTimes(ts,te,period){
  const s=ts?String(ts).slice(0,5):null,e=te?String(te).slice(0,5):null;
  if(s&&e)return[s,e];
  if(period==='morning')return['09:00','12:00'];
  if(period==='afternoon')return['13:00','17:00'];
  return['09:00','17:00'];
}
async function runMgmtSync(){
  const res={createdWeekly:0,createdMgmt:0,merged:0,updatedWeekly:0,updatedMgmt:0,deletedWeekly:0,deletedMgmt:0,excludedWeekly:0,errors:[]};
  const err=(ctx,e)=>{if(e)res.errors.push(ctx+': '+(e.message||String(e)))};
  if(!user)return res;
  const fr=await client.from('weekly_planner_tasks').select('*').eq('user_id',user.id);
  if(fr.error){res.errors.push('週間データの取得に失敗しました: '+(fr.error.message||''));return res}
  const ft=await client.from('tasks').select('*').eq('user_id',user.id);
  if(ft.error){res.errors.push('Task Management Appのデータ取得に失敗しました: '+(ft.error.message||'')+' (tasks テーブルへのアクセス権限を確認してください)');return res}
  let W=fr.data||[], M=ft.data||[];
  let projMap=new Map();
  try{const {data:projs}=await client.from('projects').select('id,title');(projs||[]).forEach(p=>projMap.set(p.id,p.title))}catch(e){/* 補助情報なので無視 */}
  const {pStart,pEnd,syncable}=mgmtSyncableFactory(M);
  const projName=t=>t.property_name||(t.project_id?projMap.get(t.project_id):null)||'';
  const toWeekly=(t,base)=>{
    const [ps,pe]=mgmtPeriodTimes(t.planned_start_time,t.planned_end_time,t.planned_time_period);
    const row={...(base||{}),id:t.id,user_id:user.id,project_name:projName(t)||(base?base.project_name:'')||'',
      description:t.title||'',start_date:pStart(t),end_date:pEnd(t),planned_start:ps,planned_end:pe,completed:t.status==='done'};
    if(t.start_time&&t.end_time){row.actual_start=String(t.start_time).slice(0,5);row.actual_end=String(t.end_time).slice(0,5)}
    else if(!base){row.actual_start=null;row.actual_end=null}
    if(!base){row.subtract_lunch=(ps<='12:00'&&pe>='13:00');row.include_saturday=false;row.include_sunday=false;row.include_holidays=false;row.planned_daily_times={};row.actual_daily_times={}}
    return row};
  const mgmtUpdateFromWeekly=(t,w)=>{
    const p={title:w.description||'',property_name:w.project_name||null,
      planned_start_date:w.start_date,planned_end_date:w.end_date,
      planned_start_time:w.planned_start?String(w.planned_start).slice(0,5):null,
      planned_end_time:w.planned_end?String(w.planned_end).slice(0,5):null,
      planned_is_all_day:false,planned_time_period:'custom'};
    if(w.completed){p.status='done';p.progress=100}
    else if(t.status==='done'){p.status='todo';p.progress=0}
    if(w.actual_start&&w.actual_end){p.start_time=String(w.actual_start).slice(0,5);p.end_time=String(w.actual_end).slice(0,5);p.is_all_day=false;p.time_period='custom'}
    if(!t.start_date||t.start_date===t.planned_start_date)p.start_date=w.start_date;
    if(!t.end_date||t.end_date===t.planned_end_date)p.end_date=w.end_date;
    const changed=Object.keys(p).some(k=>String(p[k]??'')!==String(t[k]??''));
    return changed?p:null};
  const mgmtInsertFromWeekly=w=>{
    const p={id:w.id,user_id:user.id,title:w.description||'',property_name:w.project_name||null,category:'work',
      planned_start_date:w.start_date,planned_end_date:w.end_date,
      planned_start_time:w.planned_start?String(w.planned_start).slice(0,5):null,
      planned_end_time:w.planned_end?String(w.planned_end).slice(0,5):null,
      planned_is_all_day:false,planned_time_period:'custom',
      start_date:w.start_date,end_date:w.end_date,
      status:w.completed?'done':'todo',progress:w.completed?100:0};
    if(w.actual_start&&w.actual_end){p.start_time=String(w.actual_start).slice(0,5);p.end_time=String(w.actual_end).slice(0,5);p.is_all_day=false;p.time_period='custom'}
    else{p.is_all_day=true;p.time_period='all_day'}
    return p};
  let weeklyById=new Map(W.map(w=>[w.id,w]));
  let mgmtById=new Map(M.map(t=>[t.id,t]));
  let known=new Set();
  try{known=new Set(JSON.parse(localStorage.getItem(MGMT_SYNC_KEY)||'[]'))}catch(e){known=new Set()}
  const paired=new Set();
  const dropWeekly=id=>{weeklyById.delete(id);W=W.filter(x=>x.id!==id)};
  const dropMgmt=id=>{mgmtById.delete(id);M=M.filter(x=>x.id!==id)};
  // 1) 前回ペアだったのに片方だけにあるもの = もう片方で削除された
  for(const id of [...known]){
    const t=mgmtById.get(id),w=weeklyById.get(id);
    if(t&&!w&&syncable(t)){
      const {error}=await client.from('tasks').delete().eq('id',id).eq('user_id',user.id);
      if(error)err('Task側の削除',error);else{res.deletedMgmt++;dropMgmt(id)}
    }else if(w&&!t){
      const {error}=await client.from('weekly_planner_tasks').delete().eq('id',id).eq('user_id',user.id);
      if(error)err('週間側の削除',error);else{res.deletedWeekly++;dropWeekly(id)}
    }
  }
  // 2) 同じ id のペアをそろえる (更新が新しい側を優先。時刻がなければ Task 側の予定を正とする)
  const mappedKeys=['project_name','description','start_date','end_date','planned_start','planned_end','completed','actual_start','actual_end'];
  for(const t of [...M]){
    const w=weeklyById.get(t.id);if(!w)continue;
    if(!syncable(t)){
      const {error}=await client.from('weekly_planner_tasks').delete().eq('id',w.id).eq('user_id',user.id);
      if(error)err('週間側の対象外除外',error);else{res.excludedWeekly++;dropWeekly(w.id)}
      continue;
    }
    paired.add(t.id);
    const winner=(t.updated_at&&w.updated_at)?(String(w.updated_at)>String(t.updated_at)?'weekly':'mgmt'):'mgmt';
    if(winner==='mgmt'){
      const row=toWeekly(t,w);
      if(mappedKeys.some(k=>String(row[k]??'')!==String(w[k]??''))){
        const {error}=await client.from('weekly_planner_tasks').upsert(row,{onConflict:'id'});
        if(error)err('週間側の更新',error);else res.updatedWeekly++;
      }
    }else{
      const p=mgmtUpdateFromWeekly(t,w);
      if(p){
        const {error}=await client.from('tasks').update(p).eq('id',t.id).eq('user_id',user.id);
        if(error)err('Task側の更新',error);else res.updatedMgmt++;
      }
    }
  }
  // 3) id が違う既存ペアの統合 (物件名・作業内容・開始日が一致するものが1件ずつのときだけ)
  const keyOfW=w=>`${w.project_name||''}|${w.description||''}|${w.start_date||''}`;
  const keyOfT=t=>`${projName(t)}|${t.title||''}|${pStart(t)}`;
  for(const t0 of [...M]){
    if(!syncable(t0)||weeklyById.has(t0.id))continue;
    let t=t0;
    const cand=W.filter(w=>!paired.has(w.id)&&!mgmtById.has(w.id)&&keyOfW(w)===keyOfT(t));
    if(cand.length!==1)continue;
    const w=cand[0];
    if(w.completed&&t.status!=='done'){
      const {error}=await client.from('tasks').update({status:'done',progress:100}).eq('id',t.id).eq('user_id',user.id);
      if(!error)t={...t,status:'done',progress:100};else err('Task側の完了反映',error);
    }
    if(w.actual_start&&w.actual_end&&!(t.start_time&&t.end_time)){
      const {error}=await client.from('tasks').update({start_time:String(w.actual_start).slice(0,5),end_time:String(w.actual_end).slice(0,5),is_all_day:false,time_period:'custom'}).eq('id',t.id).eq('user_id',user.id);
      if(!error)t={...t,start_time:w.actual_start,end_time:w.actual_end};else err('Task側の実績反映',error);
    }
    const row=toWeekly(t,w);row.completed=(t.status==='done')||!!w.completed;
    const del=await client.from('weekly_planner_tasks').delete().eq('id',w.id).eq('user_id',user.id);
    if(del.error){err('週間側の統合 (旧行の削除)',del.error);continue}
    const {error}=await client.from('weekly_planner_tasks').insert(row);
    if(error)err('週間側の統合',error);
    else{res.merged++;paired.add(t.id);dropWeekly(w.id);weeklyById.set(t.id,row);W.push(row)}
  }
  // 4) 片方にしかないものをもう片方に作る
  for(const t of [...M]){
    if(!syncable(t)||weeklyById.has(t.id))continue;
    const {error}=await client.from('weekly_planner_tasks').insert(toWeekly(t,null));
    if(error)err('週間側の作成',error);else{res.createdWeekly++;paired.add(t.id)}
  }
  for(const w of [...W]){
    if(paired.has(w.id)||mgmtById.has(w.id))continue;
    const {error}=await client.from('tasks').insert(mgmtInsertFromWeekly(w));
    if(error)err('Task側の作成',error);else{res.createdMgmt++;paired.add(w.id)}
  }
  try{localStorage.setItem(MGMT_SYNC_KEY,JSON.stringify([...paired]))}catch(e){/* 保存できなくても同期自体は完了 */}
  return res;
}
$('mgmtSync').onclick=async()=>{
  const btn=$('mgmtSync'),st=$('mgmtSyncStatus');
  btn.disabled=true;st.textContent='同期中…';
  try{
    const r=await runMgmtSync();
    const parts=[];
    if(r.createdMgmt)parts.push(`Task側に${r.createdMgmt}件作成`);
    if(r.createdWeekly)parts.push(`週間側に${r.createdWeekly}件作成`);
    if(r.merged)parts.push(`${r.merged}件を統合`);
    if(r.updatedMgmt)parts.push(`Task側を${r.updatedMgmt}件更新`);
    if(r.updatedWeekly)parts.push(`週間側を${r.updatedWeekly}件更新`);
    if(r.deletedMgmt)parts.push(`Task側を${r.deletedMgmt}件削除`);
    if(r.deletedWeekly)parts.push(`週間側を${r.deletedWeekly}件削除`);
    if(r.excludedWeekly)parts.push(`週間側の対象外${r.excludedWeekly}件を除外`);
    st.textContent='同期完了: '+(parts.length?parts.join('、'):'変更なし')+(r.errors.length?` / 失敗${r.errors.length}件`:'');
    if(r.errors.length)alert('一部の同期に失敗しました。\n'+r.errors.slice(0,5).join('\n'));
  }catch(e){st.textContent='同期に失敗しました: '+(e&&e.message?e.message:String(e))}
  btn.disabled=false;
  load();
};

$('export').onclick=()=>{let keys=['project_name','description','start_date','end_date','planned_start','planned_end','actual_start','actual_end','subtract_lunch','completed'];let q=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv='\ufeff'+[keys.join(','),...tasks.map(t=>keys.map(k=>q(t[k])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='weekly_planner_tasks.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(URL.startsWith('REPLACE_'))$('loginError').textContent='初期設定が必要です。Supabase URLと公開キーを設定してください。';else{client=createClient(URL,KEY,{auth:{storageKey:'weekly-planner-auth-v2',detectSessionInUrl:false}});$('signIn').onclick=async()=>{let b=$('signIn');b.disabled=true;b.textContent='ログイン中…';$('loginError').textContent='';try{let result=await Promise.race([client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('認証処理が15秒以上応答していません。通信状態を確認して再読み込みしてください。')),15000))]);let {error}=result;if(error)$('loginError').textContent=error.message;else $('loginError').textContent='認証に成功しました。画面を切り替えています…'}catch(e){$('loginError').textContent='通信または認証エラー：'+(e.message||String(e))}finally{b.disabled=false;b.textContent='ログイン'}};$('signOut').onclick=()=>client.auth.signOut();client.auth.onAuthStateChange((event,session)=>{let old=user?.id;user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user&&old!==user.id){reset();setTimeout(load,0)}if(!user)tasks=[]})}
</script></body></html>
